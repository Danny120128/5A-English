<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>5A Synonym Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app shell. Sticky top bar, one centred column (max 980px), bottom tab bar on phones and narrow split view.
   Motif: a highlighter swipe marks the word being swapped, the way students mark a text when they paraphrase. */
:root{
  --bg:#ECF0F6;
  --surface:#FFFFFF;
  --surface-2:#F4F6FA;
  --ink:#13203A;
  --muted:#58647E;
  --line:#D5DCE7;
  --accent:#2443C9;
  --accent-ink:#FFFFFF;
  --accent-soft:#E2E7FA;
  --hl:#FFD43B;
  --hl-ink:#13203A;
  --good:#0F8159;
  --good-soft:#DDF2E8;
  --bad:#C2382F;
  --bad-soft:#FBE4E1;
  --s-new:#B9C3D4;
  --s-learn:#F2A541;
  --s-fam:#5C7CF0;
  --s-mast:#169A6B;
  --shadow:0 1px 0 rgba(19,32,58,.05), 0 10px 28px -16px rgba(19,32,58,.28);
  --lift:0 -10px 28px -18px rgba(19,32,58,.55);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI","PingFang HK","Noto Sans HK","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI","PingFang HK","Noto Sans HK","Noto Sans CJK TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  --f-zh:"PingFang HK","PingFang TC","Noto Sans HK","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1424; --surface:#151F35; --surface-2:#1A2640; --ink:#E6EBF5; --muted:#98A4BD; --line:#29365A;
    --accent:#8197FF; --accent-ink:#0D1424; --accent-soft:#1F2C55;
    --hl:#F4C430; --hl-ink:#13203A; --good:#3CC593; --good-soft:#123A2F; --bad:#FF7D73; --bad-soft:#40201F;
    --s-new:#3A4767; --s-learn:#E59A35; --s-fam:#7D95FF; --s-mast:#3CC593;
    --shadow:0 1px 0 rgba(0,0,0,.25), 0 12px 30px -16px rgba(0,0,0,.6);
    --lift:0 -10px 28px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1424; --surface:#151F35; --surface-2:#1A2640; --ink:#E6EBF5; --muted:#98A4BD; --line:#29365A;
  --accent:#8197FF; --accent-ink:#0D1424; --accent-soft:#1F2C55;
  --hl:#F4C430; --hl-ink:#13203A; --good:#3CC593; --good-soft:#123A2F; --bad:#FF7D73; --bad-soft:#40201F;
  --s-new:#3A4767; --s-learn:#E59A35; --s-fam:#7D95FF; --s-mast:#3CC593;
  --shadow:0 1px 0 rgba(0,0,0,.25), 0 12px 30px -16px rgba(0,0,0,.6);
  --lift:0 -10px 28px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button,[role="button"],summary,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,[role="button"]{cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.zh{font-family:var(--f-zh)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{
  max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:8px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-height:var(--tap);font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;flex:none}
.brand-mark{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--hl);color:var(--hl-ink);font-size:14px;transform:rotate(-4deg)}
.tabs{display:flex;gap:4px;margin-left:auto;flex:none}
.tab{background:none;border:0;padding:0 14px;min-height:var(--tap);border-radius:10px;color:var(--muted);font-weight:700;font-size:15px;white-space:nowrap}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.top-actions{display:flex;gap:8px;align-items:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:0 10px;height:36px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.chip .mono{font-size:13px}
.chip svg{color:var(--s-learn)}
.lang{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:2px}
.lang button{min-width:40px;height:36px;border:0;border-radius:9px;background:none;font-weight:700;font-size:14px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.lang button[lang="zh-Hant"]{font-family:var(--f-zh)}
.icon-btn{display:inline-grid;place-items:center;width:var(--tap);height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}
.bottom-nav{display:none}

/* ---------- main ---------- */
main{
  max-width:1000px;margin:0 auto;padding-block:26px 64px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:24px;
}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:28px}
.section-head p{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);
  padding:10px 18px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:16px;line-height:1.2;
  background:var(--accent);color:var(--accent-ink);transition:transform .12s ease, filter .12s ease;text-align:center;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.hl{background:var(--hl);color:var(--hl-ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px;border-radius:10px}
.btn.lg{min-height:52px;padding:12px 24px;font-size:17px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
kbd{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid currentColor;opacity:.7;font-weight:500}
.linkish{background:none;border:0;padding:0 2px;min-height:var(--tap);display:inline-flex;align-items:center;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.linkish.small{font-size:14px}

input[type=text],input[type=search],textarea{width:100%;padding:11px 14px;min-height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
input[type=text]:focus,input[type=search]:focus,textarea:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
textarea{resize:vertical}
label.lbl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}

.hl-word{
  background-image:linear-gradient(var(--hl),var(--hl));background-repeat:no-repeat;background-position:0 62%;background-size:100% 72%;
  color:var(--hl-ink);padding:0 .14em;margin:0 -.04em;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;
}
.swipe{animation:swipe .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes swipe{from{background-size:0% 72%}to{background-size:100% 72%}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:stretch}
.hero-copy{display:flex;flex-direction:column;gap:16px;justify-content:center}
.hero h1{font-size:clamp(34px,5.2vw,54px);font-weight:800;letter-spacing:-.03em}
.hero-lede{font-size:17px;color:var(--muted);max-width:54ch}
.swap-card{padding:22px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.swap-card .eyebrow{display:flex;justify-content:space-between;gap:8px}
.swap-sentence{font-family:var(--f-display);font-weight:600;font-size:clamp(21px,2.5vw,26px);line-height:1.35;min-height:2.7em}
.swap-pair{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;min-height:24px}
.swap-pair .from{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px;color:var(--muted)}
.swap-pair .to{font-weight:700}
.swap-dots{display:flex;gap:6px;align-items:center}
.swap-dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.swap-dots i.on{background:var(--accent)}
.name-row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.name-row .field{flex:1 1 220px;min-width:0}
.hello{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:17px}
.hello strong{font-family:var(--f-display);font-size:21px}

.today{overflow:hidden}
.today-top{display:flex;align-items:center;justify-content:space-between;gap:16px 24px;padding:22px;flex-wrap:wrap}
.today-copy{display:flex;flex-direction:column;gap:6px;flex:1 1 360px;min-width:0}
.today-h{font-size:24px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface-2)}
.strip > div{padding:14px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.strip > div:last-child{border-right:0}
.strip .v{font-family:var(--f-display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.strip .v small{font-size:17px;color:var(--muted);font-weight:700}
.strip .k{font-size:13px;color:var(--muted);font-weight:700}

.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mode{text-align:left;display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);transition:border-color .15s, transform .15s;min-width:0}
.mode:active{transform:scale(.99)}
.mode-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mode-title{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.15}
.mode-desc{color:var(--muted);font-size:15px}
.mode .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px}
.glyph{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.glyph svg{width:21px;height:21px}
.mode.feature{border-width:2px;border-color:var(--hl)}
.mode.feature .glyph{background:var(--hl);color:var(--hl-ink)}
.badge{font-family:var(--f-mono);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bad-soft);color:var(--bad)}
.foot-note{font-size:13px;color:var(--muted);text-align:center}

/* ---------- session ---------- */
.session{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ses-head{display:flex;align-items:center;gap:12px}
.ses-title{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap}
.bar{flex:1;height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:40px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.bar.timer > i{background:var(--hl);transition:width .1s linear}
.ses-count{font-family:var(--f-mono);font-size:14px;color:var(--muted);min-width:48px;text-align:right}
.qcard{padding:24px;display:flex;flex-direction:column;gap:18px}
.q-label{font-size:15px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;gap:4px 12px;align-items:center;flex-wrap:wrap;min-height:var(--tap)}
.q-word{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6.5vw,52px);letter-spacing:-.025em;line-height:1.05;display:flex;align-items:center;gap:14px;flex-wrap:wrap;overflow-wrap:anywhere}
.q-word.zhq{font-family:var(--f-zh);font-weight:700;letter-spacing:0}
.q-sentence{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.4vw,30px);line-height:1.4}
.say{display:inline-grid;place-items:center;width:var(--tap);height:var(--tap);border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);flex:none}
.say svg{width:19px;height:19px}
.listen-big{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.listen-big .play{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.listen-big .play svg{width:34px;height:34px}
.reveal{font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:700;min-height:60px;transition:border-color .12s, background .12s;min-width:0;overflow-wrap:anywhere}
.opt .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.opt[disabled]{cursor:default;color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.5}
.type-row{display:flex;gap:10px}
.type-row input{font-size:20px;font-weight:700;min-width:0}
.type-row input.right{border-color:var(--good);background:var(--good-soft)}
.type-row input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.type-row input[disabled]{opacity:1;-webkit-text-fill-color:var(--ink)}

/* the result panel sticks to the bottom of the screen so the Next button is always reachable on a tablet */
.feedback{
  position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;
  padding:16px 18px;border-radius:14px;display:flex;flex-direction:column;gap:8px;border:1.5px solid transparent;box-shadow:var(--lift);
}
.feedback.ok{background:var(--good-soft);border-color:var(--good)}
.feedback.no{background:var(--bad-soft);border-color:var(--bad)}
.fb-top{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap}
.fb-verdict{font-family:var(--f-display);font-weight:800;font-size:21px}
.feedback.ok .fb-verdict{color:var(--good)}
.feedback.no .fb-verdict{color:var(--bad)}
.fb-pair{font-weight:700;font-size:17px}
.fb-ex{font-size:16px}
.fb-note{font-size:14px;color:var(--muted)}
.feedback .fb-note{color:var(--ink);opacity:.8}
.fb-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:2px}
.fb-actions .btn{min-width:140px}
.ses-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;min-height:28px}
.combo{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--muted)}
.combo.hot{color:var(--hl-ink);background:var(--hl);padding:3px 9px;border-radius:999px}
.shake{animation:shake .35s ease}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.02)}}

.intro{padding:26px 24px;display:flex;flex-direction:column;gap:16px}
.intro h2{font-size:30px}
.rules{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.rules li{display:flex;gap:12px;align-items:baseline}
.rules li .mono{font-size:13px;color:var(--accent);font-weight:700;min-width:48px}
.result-hero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.result-hero .big{font-family:var(--f-display);font-weight:800;font-size:64px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.review-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.review-list > div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* flashcards: both faces share one grid cell, so the card grows with its longest face */
.card-stage{perspective:1400px}
.flip{display:block;border-radius:var(--r);cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip-inner{display:grid;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.flip-inner.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;min-height:300px;padding:26px;display:flex;flex-direction:column;gap:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(0deg)}
.face.back{transform:rotateY(180deg)}
.face-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.face .q-word{font-size:clamp(34px,6.5vw,50px)}
.face .hint{font-size:14px;color:var(--muted)}
.deck-tabs{display:flex;gap:6px;flex-wrap:wrap}

/* match */
.match-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{min-height:96px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;padding:10px;display:grid;place-items:center;text-align:center;overflow-wrap:anywhere;transition:transform .12s, opacity .25s, border-color .12s, background .12s;min-width:0}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.gone{opacity:0;transform:scale(.9);pointer-events:none}
.tile.bad{border-color:var(--bad);background:var(--bad-soft)}
.match-time{font-family:var(--f-mono);font-size:24px;font-weight:700;min-width:90px;text-align:right}

/* word bank */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip .mono{font-size:12px;opacity:.8}
.wlist{display:flex;flex-direction:column}
.wrow{border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow summary{list-style:none;display:block;cursor:pointer}
.wrow summary::-webkit-details-marker{display:none}
.wsum,.wlist-head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.1fr) minmax(0,1fr) 72px;gap:12px;align-items:center;padding:0 16px}
.wsum{min-height:54px;padding-block:8px}
.wlist-head{padding-block:10px;border-bottom:1px solid var(--line);font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wrow[open] .wsum{background:var(--surface-2)}
.wsum .w{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.wsum .s{font-size:17px;overflow-wrap:anywhere}
.wsum .s::before{content:"⇄ ";color:var(--muted);font-family:var(--f-mono);font-size:13px}
.wsum .z{color:var(--muted)}
.wdetail{padding:4px 16px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.wdetail .ex{font-size:16px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-actions .btn svg{width:16px;height:16px}
.dots{display:flex;gap:3px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--s-new)}
.dots i.on{background:var(--s-fam)}
.dots.m i.on{background:var(--s-mast)}
.dots.l i.on{background:var(--s-learn)}
.tag-custom{font-family:var(--f-mono);font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 4px;margin-left:6px;vertical-align:2px}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.form-grid > div{min-width:0}
.form-grid .full{grid-column:1/-1}
.block{padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.block h3{font-size:20px}
.note-line{font-size:14px;color:var(--muted)}
.msg{font-size:14px;font-weight:700}
.msg .ok{color:var(--good)}
.msg .no{color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:700}

/* ranking */
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);gap:4px;flex-wrap:wrap;align-self:flex-start;max-width:100%}
.seg button{border:0;background:none;min-height:40px;padding:0 14px;border-radius:9px;font-weight:700;color:var(--muted);font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.table-wrap{overflow-x:auto}
.board{width:100%;border-collapse:collapse}
.board th{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
.board td{padding:12px 16px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.board tr:last-child td{border-bottom:0}
.board .num{text-align:right;font-family:var(--f-mono);font-weight:700}
.board td.num{font-size:17px}
.rank{width:56px}
.medal{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-family:var(--f-display);font-weight:800;font-size:15px}
.r1 .medal{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.me-row td{background:var(--accent-soft)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink)}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile-stat{padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-stat .v{font-family:var(--f-display);font-weight:800;font-size:32px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.tile-stat .v small{font-size:18px;color:var(--muted)}
.tile-stat .k{font-size:13px;color:var(--muted);font-weight:700}
.stack{display:flex;height:24px;border-radius:7px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.act{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;align-items:end;height:150px}
.act .col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:end;min-width:0}
.act .n{font-family:var(--f-mono);font-size:10px;color:var(--ink);min-height:13px;line-height:13px}
.act .b{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--accent)}
.act .b.zero{background:var(--line)}
.act .b.today{background:var(--hl)}
.act .d{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.hard{display:flex;flex-direction:column}
.hard > div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hard > div:last-child{border-bottom:0}

.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;
  transition:opacity .2s, transform .2s;z-index:40;pointer-events:none;max-width:calc(100% - 32px);text-align:center
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* hover effects only where a real pointer exists, so taps on an iPad never leave a highlighted option behind */
@media (hover:hover) and (pointer:fine){
  .tab:hover{background:var(--surface-2);color:var(--ink)}
  .tab[aria-current="page"]:hover{background:var(--accent-soft);color:var(--accent)}
  .icon-btn:hover,.btn.ghost:hover{background:var(--surface-2)}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost:hover{filter:none}
  .mode:hover{border-color:var(--accent);transform:translateY(-2px)}
  .say:hover{border-color:var(--accent);color:var(--accent)}
  .opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
  .tile:hover:not(.sel):not(.gone){border-color:var(--accent)}
  .wsum:hover{background:var(--surface-2)}
}
/* touch-only screens: keyboard hints are noise */
@media (hover:none) and (pointer:coarse){
  .kbd-hint,.btn kbd,.opt .n{display:none}
}

/* ---------- responsive ---------- */
@media (max-width:1000px){ .brand-text{display:none} }
@media (max-width:900px){
  .chip.xp{display:none}
  .hero{grid-template-columns:minmax(0,1fr)}
  .swap-sentence{min-height:0}
  .two-col{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:780px){
  .modes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .tabs{display:none}
  .top-actions{margin-left:auto}
  .bottom-nav{
    display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;
    background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);
    padding-left:max(8px, env(safe-area-inset-left,0px));padding-right:max(8px, env(safe-area-inset-right,0px));
  }
  .bottom-nav button{background:none;border:0;min-height:56px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
  .bottom-nav button svg{width:22px;height:22px}
  .bottom-nav button[aria-current="page"]{color:var(--accent)}
  body.in-session .bottom-nav{display:none}
  main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
  body.in-session main{padding-block:16px calc(28px + env(safe-area-inset-bottom,0px))}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip > div:nth-child(2){border-right:0}
  .strip > div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .wsum,.wlist-head{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 58px}
  .wsum .z,.wlist-head .z{display:none}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .match-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tile{min-height:80px;font-size:16px}
  .qcard{padding:20px 18px}
}
@media (max-width:520px){
  .modes{grid-template-columns:minmax(0,1fr)}
  .opts{grid-template-columns:minmax(0,1fr)}
  .chip-u{display:none}
  .result-hero .big{font-size:52px}
  .fb-actions .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .flip-inner.flipped,.face.back{transform:none}
  .flip-inner.flipped .front,.flip-inner:not(.flipped) .back{visibility:hidden}
}
</style>
</head>

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const norm = s => String(s==null?'':s).toLowerCase().trim().replace(/\s+/g,' ');
const squash = s => norm(s).replace(/[^a-z0-9]/g,'');
const reEsc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
/* One school day runs 08:00 to 08:00 Hong Kong time (UTC+8), the same reset as the original ranking.
   08:00 HKT is 00:00 UTC, so the UTC date is the day key. */
const dayKey = (t=Date.now()) => new Date(t).toISOString().slice(0,10);
const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const touchOnly = !!(window.matchMedia && matchMedia('(hover: none) and (pointer: coarse)').matches);
function lev(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; const d=[]; for(let i=0;i<=m;i++) d[i]=[i]; for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function fmtTime(ms){ const s=ms/1000; return s<60? s.toFixed(1)+'s' : Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }

let LANG='en';
function fill(s,v,escape){ return s.replace(/\{(\w+)\}/g,(m,k)=> v && v[k]!=null ? (escape? esc(v[k]) : String(v[k])) : m); }
function raw(k){ const d=I18N[LANG]; return (k in d)? d[k] : I18N.en[k]; }
/* tx: plain text for textContent. th: HTML-safe, values escaped. */
function tx(k,v){ const s=raw(k); if(s==null) return k; return typeof s==='function'? s(v||{}) : fill(s,v,false); }
function th(k,v){ const s=raw(k); if(s==null) return esc(k);
  if(typeof s==='function'){ const ev={}; for(const x in (v||{})) ev[x]= typeof v[x]==='string'? esc(v[x]) : v[x]; return s(ev); }
  return fill(s,v,true); }

/* ================= WORD INDEX ================= */
let IDX = null;
function buildIndex(){
  const ws=all(), pS={}, pL={};
  const find=(p,x)=>{ if(p[x]===undefined) p[x]=x; while(p[x]!==x){ x=p[x]; } return x; };
  const uni=(p,a,b)=>{ a=find(p,a); b=find(p,b); if(a!==b) p[a]=b; };
  const partners={}, byZh={};
  ws.forEach(e=>{
    const a=norm(e.w), b=norm(e.s);
    uni(pS,a,b); uni(pL,a,b);
    (partners[a]=partners[a]||new Set()).add(e.s);
    (partners[b]=partners[b]||new Set()).add(e.w);
    if(e.zh) (byZh[e.zh]=byZh[e.zh]||[]).push(e);
  });
  Object.values(byZh).forEach(list=>{ for(let i=1;i<list.length;i++){ uni(pS,norm(list[0].w),norm(list[i].w)); uni(pL,norm(list[0].w),norm(list[i].w)); } });
  LOOSE.forEach(g=>{ for(let i=1;i<g.length;i++) uni(pL,norm(g[0]),norm(g[i])); });
  const members={};
  ws.forEach(e=>{ [e.w,e.s].forEach(t=>{ const r=find(pS,norm(t)); (members[r]=members[r]||new Map()).set(squash(t),t); }); });
  IDX = { loose:t=>find(pL,norm(t)), partners, byZh, family:t=>Array.from((members[find(pS,norm(t))]||new Map()).values()) };
}
buildIndex();

function rec(e){ return P().progress[e.id]; }
function status(e){ const r=rec(e); if(!r||!r.seen) return 'new'; if(r.box>=4) return 'mastered'; if(r.box>=2) return 'familiar'; return 'learning'; }
function counts(){ const c={new:0,learning:0,familiar:0,mastered:0}; all().forEach(e=>c[status(e)]++); return c; }
function dueList(){ const now=Date.now(); return all().filter(e=>{ const r=rec(e); return r&&r.seen&&r.due<=now; }); }
function mistakeList(){ const m=P().mistakes; return all().filter(e=>m[e.id]); }
function touchDay(p){
  const today=dayKey(), yest=dayKey(Date.now()-864e5);
  if(p.streak.last!==today){ p.streak.n = (p.streak.last===yest) ? p.streak.n+1 : 1; p.streak.last=today; }
  p.act[today]=(p.act[today]||0)+1;
  const keys=Object.keys(p.act).sort(); while(keys.length>60){ delete p.act[keys.shift()]; }
}
let UNDO=null;
function grade(e, ok, xp){
  const p=P();
  UNDO = {id:e.id, prev: p.progress[e.id] ? Object.assign({}, p.progress[e.id]) : null, mistake:p.mistakes[e.id]||0, xp:p.xp};
  const r = p.progress[e.id] ? Object.assign({}, p.progress[e.id]) : {box:0,due:0,seen:0,right:0,wrong:0};
  r.seen++;
  if(ok){ r.right++; r.box=Math.min(5,r.box+1); delete p.mistakes[e.id]; p.xp += (xp==null?10:xp); }
  else { r.wrong++; r.box=0; p.mistakes[e.id]=(p.mistakes[e.id]||0)+1; }
  r.due = Date.now()+INTERVALS[r.box]; r.last=Date.now();
  p.progress[e.id]=r; touchDay(p); save(); updateChrome();
}
function undoAsRight(e){
  if(!UNDO||UNDO.id!==e.id) return;
  const p=P();
  if(UNDO.prev) p.progress[e.id]=UNDO.prev; else delete p.progress[e.id];
  if(UNDO.mistake) p.mistakes[e.id]=UNDO.mistake; else delete p.mistakes[e.id];
  p.xp=UNDO.xp;
  const k=dayKey(); if(p.act[k]) p.act[k]--;
  UNDO=null; grade(e,true);
}
function pickItems(n, pool){
  const now=Date.now(), p=P(); pool=shuffle(pool||all());
  const due=[], fresh=[], rest=[];
  pool.forEach(e=>{ const r=p.progress[e.id]; if(!r||!r.seen) fresh.push(e); else if(r.due<=now) due.push(e); else rest.push(e); });
  due.sort((a,b)=>p.progress[a.id].box-p.progress[b.id].box);
  rest.sort((a,b)=>p.progress[a.id].due-p.progress[b.id].due);
  return due.concat(fresh,rest).slice(0,n);
}
function weakFirst(n, pool){
  const p=P(); pool=shuffle(pool||all());
  pool.sort((a,b)=>{ const ra=p.progress[a.id], rb=p.progress[b.id]; return (ra?ra.box:-1)-(rb?rb.box:-1); });
  return shuffle(pool.slice(0, Math.max(n, Math.ceil(pool.length*.6)))).slice(0,n);
}

function distractors(e, field, n, avoid){
  const root=IDX.loose(e.w), avoidSq=new Set(avoid.map(squash)), seen=new Set(), pool=[];
  const other = field==='s'?'w':'s';
  shuffle(all()).forEach(x=>{
    if(IDX.loose(x.w)===root) return;
    [[x[field],0],[x[other],1]].forEach(([t,k])=>{
      const q=squash(t); if(!q||avoidSq.has(q)||seen.has(q)||IDX.loose(t)===root) return;
      seen.add(q); pool.push({t,k});
    });
  });
  pool.sort((a,b)=>a.k-b.k);
  return pool.slice(0,n).map(p=>p.t);
}
function clozeParts(e){
  if(!e.ex) return null;
  const m=e.ex.match(new RegExp('\\b'+reEsc(e.w)+'([a-z]*)','i')); if(!m) return null;
  return {before:e.ex.slice(0,m.index), hit:m[0], suffix:m[1], after:e.ex.slice(m.index+m[0].length), atStart:m.index===0};
}
function swapped(e){
  const c=clozeParts(e); if(!c) return null;
  let rep = e.s + c.suffix;
  if(c.atStart) rep = rep.charAt(0).toUpperCase()+rep.slice(1);
  return {before:c.before, rep, after:c.after};
}
function mkMC(e, type){
  if(type==='cloze' && !clozeParts(e)) type='w2s';
  if(type==='listen' && !hasTTS) type='w2s';
  const answer = type==='s2w' ? e.w : e.s;
  const field = type==='s2w' ? 'w' : 's';
  const opts = shuffle([answer].concat(distractors(e, field, 3, [answer, e.w, e.s])));
  return {kind:'mc', type, e, answer, opts};
}
function mkType(e, type){
  if(type==='zh2en' && !e.zh) type='typeSyn';
  if(type==='dict' && !hasTTS) type='typeSyn';
  const acc=new Map(), add=t=>{ const q=squash(t); if(q) acc.set(q,t); };
  if(type==='dict') add(e.w);
  else if(type==='typeSyn'){ (IDX.partners[norm(e.w)]||[]).forEach(add); IDX.family(e.w).forEach(t=>{ if(squash(t)!==squash(e.w)) add(t); }); }
  else (IDX.byZh[e.zh]||[e]).forEach(x=>{ add(x.w); add(x.s); });
  return {kind:'type', type, e, accepted:acc, answer:(type==='typeSyn'?e.s:e.w)};
}
function questionFor(e, mode){
  if(mode==='paraphrase') return mkMC(e,'cloze');
  if(mode==='listen') return Math.random()<.5 ? mkMC(e,'listen') : mkType(e,'dict');
  if(mode==='speed') return mkMC(e, pick(['w2s','s2w','cloze']));
  const r=rec(e), box=r?r.box:0;
  if(box>=2) return mkType(e, (e.zh && Math.random()<.5)?'zh2en':'typeSyn');
  const types=['w2s','s2w','cloze']; if(hasTTS) types.push('listen');
  return mkMC(e, pick(types));
}

function record(ok){
  const e=SES.q.e;

function answerMC(i){
  if(!SES||SES.stage!=='q'||SES.answered||!SES.q||SES.q.kind!=='mc') return;
  const q=SES.q, ok=squash(q.opts[i])===squash(q.answer);
  SES.answered=true; SES.fb={ok, choice:i, vi:Math.floor(Math.random()*4), anim:true};
  record(ok); renderSession(); SES.fb.anim=false;
  if(SES.mode==='speed'){ const run=SES, n=SES.qn; setTimeout(()=>{ if(SES===run && SES.stage==='q' && SES.qn===n) nextQ(); }, ok?450:1300); return; }
  focusNext();
}
function answerType(){
  if(!SES||SES.stage!=='q'||SES.answered||!SES.q||SES.q.kind!=='type') return;
  const inp=$('#type-in'), typed=inp?inp.value.trim():'';
  if(!typed){ if(inp) inp.focus(); return; }
  const q=SES.q, tq=squash(typed), ok=q.accepted.has(tq);
  let near=false; if(!ok) for(const k of q.accepted.keys()){ if(k.length>=4 && lev(tq,k)===1){ near=true; break; } }
  if(inp) inp.blur();
  SES.answered=true; SES.fb={ok, typed, near, vi:Math.floor(Math.random()*4), anim:true};
  record(ok); renderSession(); SES.fb.anim=false; focusNext();
}
function nextQ(){
  if(!SES||SES.stage!=='q') return;
  SES.qn++; SES.answered=false; SES.fb=null; SES.hint=false;
  if(SES.mode==='speed'){
    const last=SES.q&&SES.q.e.id; let e, guard=0;
    do{ e=pick(SES.pool); }while(SES.pool.length>1 && e.id===last && guard++<20);
    SES.q=questionFor(e,'speed'); renderSession(); return;
  }
  SES.i++;
  if(SES.i>=SES.items.length){ finish(); return; }
  SES.q=questionFor(SES.items[SES.i], SES.mode); renderSession(); window.scrollTo(0,0); autoSpeak();
}
function finish(){
  stopTimers();

    if(SES.score>p.speedBest){ p.speedBest=SES.score; SES.newBest=true; }
    addBoard({mode:'speed', score:SES.score, right:SES.right});
  } else p.xp+=20;
  save(); renderSession(); updateChrome(); window.scrollTo(0,0);
}

/* ----- match ----- */
function newMatchBoard(){
  const chosen=[], roots=new Set();
  weakFirst(all().length).forEach(e=>{ const r=IDX.loose(e.w); if(chosen.length<6 && !roots.has(r)){ roots.add(r); chosen.push(e); } });
  const tiles=[]; chosen.forEach(e=>{ tiles.push({id:e.id, t:e.w}); tiles.push({id:e.id, t:e.s}); });
  return shuffle(tiles).map((x,i)=>Object.assign(x,{k:i, gone:false}));
}

function matchTick(){ if(!SES||SES.mode!=='match'||SES.stage!=='play'||!SES.t0) return; const el=$('#mtime'); if(el) el.textContent=fmtTime(Date.now()-SES.t0+SES.misses*1000); }
function tileTap(k){
  if(!SES||SES.mode!=='match'||SES.stage!=='play'||SES.busy) return;
  const t=SES.tiles.find(x=>x.k===k); if(!t||t.gone) return;
  if(!SES.t0){ SES.t0=Date.now(); timerI=setInterval(matchTick,100); }
  const el=$('.tile[data-k="'+k+'"]');
  if(SES.sel===null){ SES.sel=k; el.classList.add('sel'); return; }
  if(SES.sel===k){ SES.sel=null; el.classList.remove('sel'); return; }
  const a=SES.tiles.find(x=>x.k===SES.sel), aEl=$('.tile[data-k="'+SES.sel+'"]');
  if(a.id===t.id){
    a.gone=t.gone=true; SES.sel=null; beep(true);
    [aEl,el].forEach(x=>{ x.classList.remove('sel'); x.classList.add('gone'); x.disabled=true; });
    grade(byId(t.id), true, 5);
    const left=SES.tiles.filter(x=>!x.gone).length/2, ml=$('#mleft'); if(ml) ml.textContent=left;
    if(!left){
      clearInterval(timerI); timerI=null;
      SES.time=Date.now()-SES.t0+SES.misses*1000;
      const p=P(); if(!p.matchBest||SES.time<p.matchBest){ p.matchBest=SES.time; SES.newBest=true; }

    }
  } else {
    SES.misses++; SES.busy=true; beep(false);
    [aEl,el].forEach(x=>{ x.classList.remove('sel'); x.classList.add('bad','shake'); });
    const s=SES;
    setTimeout(()=>{ [aEl,el].forEach(x=>x.classList.remove('bad','shake')); s.sel=null; s.busy=false; }, 450);
  }
}

/* ================= NAMES & BOARD ================= */
function setName(name, quiet){
  name=String(name||'').trim().slice(0,24);
  const key=norm(name);
  if(!key) return;
  if(key===S.current){ P().display=name; save(); return; }
  if(!S.profiles[key]){
    const guest=S.profiles[''];
    if(S.current==='' && guest && Object.keys(guest.progress).length){ S.profiles[key]=Object.assign(guest,{display:name}); S.profiles['']=blankProfile(''); }
    else S.profiles[key]=blankProfile(name);
  } else if(!S.profiles[key].display) S.profiles[key].display=name;
  S.current=key; save();
  if(!quiet) toast(tx('hi_toast',{name:S.profiles[key].display||name}));
}
function addBoard(row){
  S.board.push(Object.assign({name:displayName()||tx('guest'), key:S.current, day:dayKey(), ts:Date.now()}, row));
  if(S.board.length>400) S.board=S.board.slice(-400);
}

  const today=dayKey(), mode=BOARD_TAB.startsWith('match')?'match':'speed', isTime=mode==='match', allTime=BOARD_TAB.endsWith('-all');
  const best={};
  S.board.filter(r=>r.mode===mode && (allTime || r.day===today)).forEach(r=>{ const k=r.key||norm(r.name); const b=best[k]; if(!b || (isTime? r.score<b.score : r.score>b.score)) best[k]=r; });
  const rows=Object.values(best).sort((a,b)=>isTime? a.score-b.score : b.score-a.score).slice(0,20);
  const seg=[['speed','seg_speed'],['match','seg_match'],['speed-all','seg_speed_all'],['match-all','seg_match_all']].map(([k,l])=>'<button data-act="board-tab" data-k="'+k+'" aria-pressed="'+(BOARD_TAB===k)+'">'+th(l)+'</button>').join('');
  const table = rows.length
    ? '<div class="table-wrap"><table class="board"><thead><tr><th>#</th><th>'+th('th_name')+'</th><th>'+th(allTime?'th_date':'th_played')+'</th><th class="num">'+th(isTime?'th_time':'th_score')+'</th></tr></thead><tbody>'+
      rows.map((r,i)=>'<tr class="'+(S.current&&r.key===S.current?'me-row':'')+'"><td class="rank'+(i===0?' r1':'')+'"><span class="medal">'+(i+1)+'</span></td><td><strong>'+esc(r.name)+'</strong><br><span class="muted small">'+boardDetail(r)+'</span></td><td class="muted small">'+(allTime? esc(r.day) : new Date(r.ts).toLocaleTimeString(LANG==='zh'?'zh-HK':'en-GB',{hour:'2-digit',minute:'2-digit'}))+'</td><td class="num">'+(isTime?fmtTime(r.score):r.score)+'</td></tr>').join('')+
      '</tbody></table></div>'
    : '<div class="empty"><strong>'+th(allTime?'no_scores':'no_scores_today')+'</strong><span>'+th('play_first')+'</span><button class="btn" data-start="'+mode+'">'+th('play_mode',{mode:tx(isTime?'m_match':'m_speed')})+'</button></div>';
  const clear = BOARD_CONFIRM
    ? '<span class="confirm">'+th('clear_q')+' <button class="btn danger sm" data-act="board-clear-yes">'+th('clear')+'</button><button class="btn ghost sm" data-act="board-clear-no">'+th('cancel')+'</button></span>'
    : '<button class="btn ghost sm" data-act="board-clear">'+th('clear_today')+'</button>';
  return '<section class="section-head"><div><p class="eyebrow">'+th('board_eyebrow')+'</p><h2>'+th('board_h')+'</h2></div><p class="small">'+th('board_sub')+'</p></section>'+
    '<div class="seg" role="group" aria-label="'+th('which_rank')+'">'+seg+'</div>'+
    '<section class="panel">'+table+'</section>'+
    '<div class="toolbar" style="justify-content:space-between"><p class="note-line" style="flex:1 1 320px">'+th('board_note')+'</p>'+clear+'</div>';
}

/* ================= WORDS ================= */
let W_FILTER='all', W_QUERY='', W_DEL=null, W_MSG='', IMPORT_MSG='';
function viewWords(){
  const a=all(), cnt={all:a.length, learning:0, mastered:0, mistakes:mistakeList().length, custom:S.custom.length};
  a.forEach(e=>{ if(status(e)==='mastered') cnt.mastered++; else cnt.learning++; });
  const chips=[['all','f_all'],['learning','f_learning'],['mastered','f_mastered'],['mistakes','f_mistakes'],['custom','f_custom']].map(([k,l])=>'<button class="fchip" data-act="wfilter" data-k="'+k+'" aria-pressed="'+(W_FILTER===k)+'">'+th(l)+'<span class="mono">'+cnt[k]+'</span></button>').join('');
  return '<section class="section-head"><div><p class="eyebrow">'+th('words_eyebrow')+'</p><h2>'+th('words_h',{n:a.length})+'</h2></div><button class="btn hl" data-start="cards">'+th('study_cards')+'</button></section>'+
  '<input type="search" id="wsearch" placeholder="'+th('search_ph')+'" value="'+esc(W_QUERY)+'" aria-label="'+th('search_aria')+'" autocapitalize="none" autocorrect="off" enterkeyhint="search">'+
  '<div class="filters">'+chips+'</div>'+
  '<section class="panel"><div class="wlist-head" aria-hidden="true"><span>'+th('col_word')+'</span><span>'+th('col_syn')+'</span><span class="z">'+th('col_zh')+'</span><span>'+th('col_level')+'</span></div><div class="wlist" id="wlist">'+wordRows()+'</div></section>'+
  '<div class="two-col">'+
    '<section class="panel block"><h3>'+th('add_h')+'</h3><p class="note-line">'+th('add_note')+'</p>'+
      '<form id="add-form" class="form-grid" autocomplete="off"><div><label class="lbl" for="add-w">'+th('add_w')+'</label><input type="text" id="add-w" maxlength="40" autocapitalize="none" required></div><div><label class="lbl" for="add-s">'+th('add_s')+'</label><input type="text" id="add-s" maxlength="40" autocapitalize="none" required></div><div><label class="lbl" for="add-z">'+th('add_z')+'</label><input type="text" id="add-z" maxlength="40" class="zh"></div><div class="full"><label class="lbl" for="add-ex">'+th('add_ex')+'</label><input type="text" id="add-ex" maxlength="160"></div><div class="full toolbar"><button class="btn" type="submit">'+th('add_btn')+'</button><span class="msg" id="add-msg" role="status">'+W_MSG+'</span></div></form></section>'+
    '<section class="panel block"><h3>'+th('share_h')+'</h3><p class="note-line">'+th('share_note')+'</p>'+
      '<div class="toolbar"><button class="btn ghost" data-act="copy-csv">'+th('copy_csv')+'</button></div>'+
      '<div id="csv-wrap" hidden><label class="lbl" for="csv-out">'+th('csv_label')+'</label><textarea id="csv-out" rows="4" readonly></textarea></div>'+
      '<div><label class="lbl" for="import-in">'+th('import_label')+'</label><textarea id="import-in" rows="4" placeholder="resilient,tough,堅韌的&#10;boost,increase,提升"></textarea></div><div class="toolbar"><button class="btn" data-act="import">'+th('import_btn')+'</button><span class="msg" id="import-msg" role="status">'+IMPORT_MSG+'</span></div></section>'+
  '</div>';
}
function wordRows(){
  const q=norm(W_QUERY), qz=W_QUERY.trim(), m=P().mistakes;
  const list=all().filter(e=>{
    const s=status(e);
    if(W_FILTER==='learning' && s==='mastered') return false;
    if(W_FILTER==='mastered' && s!=='mastered') return false;
    if(W_FILTER==='mistakes' && !m[e.id]) return false;
    if(W_FILTER==='custom' && !e.custom) return false;
    if(q && !(norm(e.w).includes(q)||norm(e.s).includes(q)||(qz && (e.zh||'').includes(qz)))) return false;
    return true;
  });
  if(!list.length) return '<div class="empty"><strong>'+th('no_words')+'</strong><span>'+th(W_FILTER==='custom'&&!q?'no_words_custom':'no_words_try')+'</span></div>';
  return list.map(e=>{
    const r=rec(e), box=r?r.box:0, s=status(e), lvl=tx('lvl_'+s);
    const dots='<span class="dots '+(s==='mastered'?'m':s==='learning'?'l':'')+'" aria-label="'+esc(lvl)+'">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=box?'on':'')+'"></i>').join('')+'</span>';
    const c=clozeParts(e), sw=swapped(e), note=noteFor(e);
    const del = e.custom ? (W_DEL===e.id ? '<span class="confirm">'+th('del_q')+' <button class="btn danger sm" data-act="del-yes" data-id="'+e.id+'">'+th('del')+'</button><button class="btn ghost sm" data-act="del-no">'+th('keep')+'</button></span>' : '<button class="btn ghost sm" data-act="del" data-id="'+e.id+'">'+th('del')+'</button>') : '';
    return '<details class="wrow" data-id="'+e.id+'"'+(W_DEL===e.id?' open':'')+'><summary><span class="wsum"><span class="w">'+esc(e.w)+(e.custom?'<span class="tag-custom">'+th('yours')+'</span>':'')+'</span><span class="s">'+esc(e.s)+'</span><span class="z zh">'+esc(e.zh||'—')+'</span>'+dots+'</span></summary><div class="wdetail">'+
      (sw?'<p class="ex">'+esc(c.before)+'<span class="hl-word">'+esc(c.hit)+'</span>'+esc(c.after)+'</p><p class="ex muted">→ '+esc(sw.before)+'<span class="hl-word">'+esc(sw.rep)+'</span>'+esc(sw.after)+'</p>':'')+
      (note?'<p class="fb-note">'+esc(note)+'</p>':'')+
      (e.zh?'<p class="zh small">'+esc(e.zh)+'</p>':'')+
      '<p class="small muted">'+th('level_line',{lvl, box})+' · '+(r&&r.seen? th('rw_line',{r:r.right,w:r.wrong}) : th('not_practised'))+'</p>'+
      '<div class="row-actions"><button class="btn ghost sm" data-act="say" data-text="'+esc(e.w)+'">'+ICON.say+' '+esc(e.w)+'</button><button class="btn ghost sm" data-act="say" data-text="'+esc(e.s)+'">'+ICON.say+' '+esc(e.s)+'</button>'+del+'</div></div></details>';
  }).join('');
}
function csvCell(s){ s=String(s==null?'':s); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }
function parseCSVLine(line){ const out=[]; let cur='', q=false; for(let i=0;i<line.length;i++){ const c=line[i]; if(q){ if(c==='"'&&line[i+1]==='"'){cur+='"';i++;} else if(c==='"') q=false; else cur+=c; } else if(c==='"') q=true; else if(c===','||c==='\t'||c==='，'){ out.push(cur); cur=''; } else cur+=c; } out.push(cur); return out.map(x=>x.trim()); }
function addCustom(w,s,zh,ex){
  w=String(w||'').trim(); s=String(s||'').trim(); zh=String(zh||'').trim(); ex=String(ex||'').trim();
  if(!w||!s) return 'missing';
  if(all().some(e=>squash(e.w)===squash(w)&&squash(e.s)===squash(s))) return 'dupe';
  S.custom.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), w:w.slice(0,40), s:s.slice(0,40), zh:zh.slice(0,40), ex:ex.slice(0,160)});
  return 'ok';
}

/* ================= PROGRESS ================= */
let RESET_CONFIRM=false;
function viewProgress(){
  const p=P(), c=counts(), total=all().length;
  let right=0, wrong=0; Object.values(p.progress).forEach(r=>{ right+=r.right||0; wrong+=r.wrong||0; });
  const acc = right+wrong ? Math.round(right/(right+wrong)*100)+'%' : '—';
  const today=dayKey(), yest=dayKey(Date.now()-864e5), streak=(p.streak.last===today||p.streak.last===yest)? p.streak.n : 0;
  const seg=(k,col)=> c[k] ? '<i style="width:'+(c[k]/total*100)+'%;background:var(--'+col+')"></i>' : '';
  const days=[]; for(let i=13;i>=0;i--){ const k=dayKey(Date.now()-i*864e5); days.push({k, n:p.act[k]||0, today:i===0}); }
  const max=Math.max(10,...days.map(d=>d.n));
  const hard=all().map(e=>({e, r:rec(e)})).filter(x=>x.r&&x.r.wrong).sort((a,b)=>(b.r.wrong-b.r.right*.3)-(a.r.wrong-a.r.right*.3)).slice(0,6);
  const who = displayName() || tx('guest');
  const reset = RESET_CONFIRM
    ? '<span class="confirm">'+th('reset_q',{who})+' <button class="btn danger sm" data-act="reset-yes">'+th('erase')+'</button><button class="btn ghost sm" data-act="reset-no">'+th('cancel')+'</button></span>'
    : '<button class="btn ghost sm" data-act="reset">'+th('reset')+'</button>';
  return '<section class="section-head"><div><p class="eyebrow">'+th('prog_eyebrow')+'</p><h2>'+esc(who)+'</h2></div>'+(displayName()?'<button class="linkish" data-act="change-name">'+th('switch_name')+'</button>':'<button class="linkish" data-act="change-name">'+th('add_name')+'</button>')+'</section>'+
  '<section class="tiles">'+
    '<div class="panel tile-stat"><span class="v">'+c.mastered+'<small>/'+total+'</small></span><span class="k">'+th('t_mastered')+'</span></div>'+
    '<div class="panel tile-stat"><span class="v">'+acc+'</span><span class="k">'+th('t_acc')+'</span></div>'+
    '<div class="panel tile-stat"><span class="v">'+streak+'</span><span class="k">'+th('t_streak')+'</span></div>'+
    '<div class="panel tile-stat"><span class="v">'+p.xp+'</span><span class="k">'+th('t_xp')+'</span></div>'+
  '</section>'+
  '<section class="panel block"><h3>'+th('where_h')+'</h3><div class="stack" role="img" aria-label="'+th('stack_aria',{a:c.new,b:c.learning,c:c.familiar,d:c.mastered})+'">'+seg('mastered','s-mast')+seg('familiar','s-fam')+seg('learning','s-learn')+seg('new','s-new')+'</div>'+
    '<div class="legend"><span><i style="background:var(--s-mast)"></i>'+th('lvl_mastered')+' '+c.mastered+'</span><span><i style="background:var(--s-fam)"></i>'+th('lvl_familiar')+' '+c.familiar+'</span><span><i style="background:var(--s-learn)"></i>'+th('lvl_learning')+' '+c.learning+'</span><span><i style="background:var(--s-new)"></i>'+th('lvl_new')+' '+c.new+'</span></div>'+
    '<p class="note-line">'+th('where_note')+'</p></section>'+
  '<div class="two-col">'+
    '<section class="panel block"><h3>'+th('days_h')+'</h3><div class="act" role="img" aria-label="'+th('days_aria')+'">'+days.map(d=>'<div class="col"><span class="n">'+(d.n||'')+'</span><span class="b'+(d.n?'':' zero')+(d.today?' today':'')+'" style="height:'+(d.n? Math.max(5,d.n/max*100):2)+'%"></span><span class="d">'+d.k.slice(8)+'</span></div>').join('')+'</div><p class="note-line">'+th('days_note')+'</p></section>'+
    '<section class="panel block"><h3>'+th('hard_h')+'</h3>'+(hard.length?'<div class="hard">'+hard.map(x=>'<div><span><strong>'+esc(x.e.w)+'</strong> ⇄ '+esc(x.e.s)+'</span><span class="mono small muted">'+th('n_wrong',{n:x.r.wrong})+'</span></div>').join('')+'</div><button class="btn hl sm" data-start="mistakes" style="align-self:start">'+th('practise_these')+'</button>':'<p class="muted">'+th('hard_none')+'</p>')+'</section>'+
  '</div>'+
  '<div class="toolbar" style="justify-content:flex-end">'+reset+'</div>';
}

/* ================= EVENTS ================= */
function refreshWords(){ const l=$('#wlist'); if(l) l.innerHTML=wordRows(); }
document.addEventListener('click', ev=>{
  const g=ev.target.closest('[data-go]'); if(g){ ev.preventDefault(); go(g.dataset.go); return; }
  const st=ev.target.closest('[data-start]'); if(st){ ev.preventDefault(); start(st.dataset.start); return; }
  const a=ev.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act;
  switch(act){
    case 'opt': answerMC(+a.dataset.i); break;
    case 'next': nextQ(); break;
    case 'exit': stopTimers(); SES=null; render(); window.scrollTo(0,0); break;
    case 'say': ev.preventDefault(); say(a.dataset.text); break;
    case 'say-slow': say(a.dataset.text, .6); break;
    case 'hint': if(SES){ SES.hint=true; const h=$('#hint'); if(h) h.hidden=false; a.remove(); } break;
    case 'first-letter': { const inp=$('#type-in'); if(SES && inp && !SES.answered){ SES.hint=true; inp.value=SES.q.answer.charAt(0); inp.focus(); a.remove(); } break; }
    case 'cant-hear': if(SES && SES.q && !SES.answered){ SES.q=mkMC(SES.q.e,'w2s'); renderSession(); } break;
    case 'override': if(SES && SES.fb && !SES.fb.ok){ const e=SES.q.e; undoAsRight(e); SES.wrong--; SES.right++; SES.combo=Math.max(1,SES.combo); SES.wrongIds=SES.wrongIds.filter(x=>x!==e.id); SES.fb.ok=true; SES.fb.overridden=true; renderSession(); focusNext(); } break;
    case 'sound': S.sound=!S.sound; save(); updateChrome(); break;
    case 'lang': {
      if(a.dataset.l===LANG) break;
      const keep={}; $$('#view input[id], #view textarea[id]').forEach(el=>{ if(!el.disabled && !el.readOnly) keep[el.id]=el.value; });
      const y=window.scrollY;
      LANG=S.lang=(a.dataset.l==='zh'?'zh':'en'); save();
      render();
      Object.keys(keep).forEach(id=>{ const el=document.getElementById(id); if(el && !el.disabled) el.value=keep[id]; });
      window.scrollTo(0,y);
      break;
    }
    case 'change-name': S.current=''; if(!S.profiles['']) S.profiles['']=blankProfile(''); save(); go('home'); { const n=$('#name-in'); if(n) n.focus(); } break;
    case 'tile': tileTap(+a.dataset.k); break;
    case 'match-again': matchGo(false); break;
    case 'flip': flipCard(); break;
    case 'card-know': cardMark(true); break;
    case 'card-again': cardMark(false); break;
    case 'deck': if(SES){ SES.deck=a.dataset.k; SES.order=shuffle(deckList(SES.deck)).map(e=>e.id); SES.i=0; SES.known=0; SES.again=0; SES.flipped=false; renderSession(); } break;
    case 'board-tab': BOARD_TAB=a.dataset.k; BOARD_CONFIRM=false; render(); break;
    case 'board-clear': BOARD_CONFIRM=true; render(); break;
    case 'board-clear-no': BOARD_CONFIRM=false; render(); break;
    case 'board-clear-yes': { const t=dayKey(); S.board=S.board.filter(r=>r.day!==t); save(); BOARD_CONFIRM=false; render(); toast(tx('cleared')); break; }
    case 'wfilter': W_FILTER=a.dataset.k; $$('.filters .fchip').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.k===W_FILTER))); W_DEL=null; refreshWords(); break;
    case 'del': ev.preventDefault(); W_DEL=a.dataset.id; refreshWords(); break;
    case 'del-no': ev.preventDefault(); W_DEL=null; refreshWords(); break;
    case 'del-yes': { ev.preventDefault(); const id=a.dataset.id; S.custom=S.custom.filter(c=>c.id!==id); Object.values(S.profiles).forEach(p=>{ delete p.progress[id]; delete p.mistakes[id]; }); W_DEL=null; save(); buildIndex(); render(); toast(tx('deleted')); break; }
    case 'copy-csv': {
      const rows=[['word','synonym','chinese','example']].concat(all().map(e=>[e.w,e.s,e.zh,e.ex||''])).map(r=>r.map(csvCell).join(',')).join('\n');
      const fallback=()=>{ const w=$('#csv-wrap'), o=$('#csv-out'); if(w&&o){ w.hidden=false; o.value=rows; o.focus(); o.select(); } toast(tx('copy_blocked')); };
      try{ navigator.clipboard.writeText(rows).then(()=>toast(tx('copied')), fallback); }catch(e){ fallback(); }
      break;
    }
    case 'import': {
      const ta=$('#import-in'), txt=ta?ta.value:''; let ok=0, dupe=0, bad=0;
      txt.split(/\r?\n/).forEach(line=>{ if(!line.trim()) return; const c=parseCSVLine(line); if(/^word$/i.test(c[0])) return; const r=addCustom(c[0],c[1],c[2],c[3]); if(r==='ok') ok++; else if(r==='dupe') dupe++; else bad++; });
      if(ok){ save(); buildIndex(); }
      IMPORT_MSG = ok||dupe||bad ? '<span class="'+(ok?'ok':'no')+'">'+th('imp_added',{n:ok})+(dupe?th('imp_dupe',{n:dupe}):'')+(bad?th('imp_bad',{n:bad}):'')+'</span>' : '<span class="no">'+th('imp_empty')+'</span>';
      const keepTxt = ok ? '' : txt;
      render(); IMPORT_MSG='';
      const ta2=$('#import-in'); if(ta2) ta2.value=keepTxt;
      break;
    }
    case 'reset': RESET_CONFIRM=true; render(); break;
    case 'reset-no': RESET_CONFIRM=false; render(); break;
    case 'reset-yes': { const d=P().display; S.profiles[S.current]=blankProfile(d); save(); RESET_CONFIRM=false; render(); toast(tx('reset_done')); break; }
  }
});
document.addEventListener('submit', ev=>{
  ev.preventDefault();
  const id=ev.target.id;
  if(id==='type-form'){ answerType(); return; }
  if(id==='name-form'){ const n=$('#name-in'), v=n?n.value.trim():''; if(!v){ if(n) n.focus(); toast(tx('need_name')); return; } n.blur(); setName(v); render(); return; }
  if(id==='speed-form'){ speedGo(); return; }
  if(id==='match-form'){ matchGo(true); return; }
  if(id==='add-form'){
    const vals={w:$('#add-w').value, s:$('#add-s').value, z:$('#add-z').value, ex:$('#add-ex').value};
    const w=vals.w.trim();
    let msg, ok=false;
    if(vals.ex.trim() && w && !new RegExp('\\b'+reEsc(w),'i').test(vals.ex)) msg='<span class="no">'+th('ex_missing',{w})+'</span>';
    else {
      const r=addCustom(vals.w,vals.s,vals.z,vals.ex);
      ok = r==='ok';
      msg = ok ? '<span class="ok">'+th('added',{w, s:vals.s.trim()})+'</span>' : r==='dupe' ? '<span class="no">'+th('dupe')+'</span>' : '<span class="no">'+th('missing')+'</span>';
      if(ok){ save(); buildIndex(); W_FILTER='custom'; W_QUERY=''; }
    }
    W_MSG=msg; render(); W_MSG='';
    if(!ok){ $('#add-w').value=vals.w; $('#add-s').value=vals.s; $('#add-z').value=vals.z; $('#add-ex').value=vals.ex; }
  }
});
document.addEventListener('input', ev=>{ if(ev.target.id==='wsearch'){ W_QUERY=ev.target.value; W_DEL=null; refreshWords(); } });
document.addEventListener('keydown', ev=>{
  if(!SES || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const tg=ev.target, tag=tg && tg.tagName, typing = tag==='INPUT' || tag==='TEXTAREA';
  if(SES.mode==='cards'){
    if(typing || !SES.order || SES.i>=SES.order.length) return;
    const onFlip = tg===document.body || (tg.classList && tg.classList.contains('flip'));
    if((ev.key===' '||ev.key==='Enter') && onFlip){ ev.preventDefault(); flipCard(); }
    else if(ev.key==='ArrowRight'){ ev.preventDefault(); cardMark(true); }
    else if(ev.key==='ArrowLeft'){ ev.preventDefault(); cardMark(false); }
    return;
  }
  if(SES.stage!=='q' || !SES.q) return;
  if(SES.q.kind==='mc' && !SES.answered && !typing && /^[1-4]$/.test(ev.key)){ ev.preventDefault(); answerMC(+ev.key-1); return; }
  if(ev.key==='Enter' && SES.answered && SES.mode!=='speed' && tag!=='BUTTON' && tag!=='A'){ ev.preventDefault(); nextQ(); }
});

/* ================= BOOT ================= */
const h=(location.hash||'').replace('#','');
if(VIEWS.includes(h)) VIEW=h;
render();
})();
</script>
